name: Publish release to PyPI and TestPyPI
run-name: Publish Tag - ${{ inputs.repository_ref }}

on:
  workflow_dispatch:
    inputs:
      repository_ref:
        type: string
        required: true
  workflow_call:
    inputs:
      repository_ref:
        type: string
        required: true

jobs:
  build:
    name: Build distribution package
    runs-on: ubuntu-latest

    steps:
    - name: Checkout release ${{ inputs.repository_ref }}
      uses: actions/checkout@v7
      with:
        ref: '${{ inputs.repository_ref }}'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install 'build' library
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build library
      shell: bash
      run: python -m build

    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-testpypi:
    runs-on: ubuntu-latest
    needs: [build]

    environment:
      name: testpypi
      url: https://test.pypi.org/p/aindo-anonymize

    permissions:
      id-token: write

    steps:
    - name: Download all the distributions
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish package to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    runs-on: ubuntu-latest
    needs: [build, publish-to-testpypi]

    environment:
      name: pypi
      url: https://pypi.org/p/aindo-anonymize

    permissions:
      id-token: write

    steps:
    - name: Download all the distributions
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
